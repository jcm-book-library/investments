# Which prices the daily job downloads.
#
# Add a ticker here and its full price history appears in the app after the next
# run (Actions → "Update prices" → Run workflow, or wait for the 6pm weekday run).
# ASX codes need no suffix: "VAS" is fetched as VAS.AX. For anything not on the
# ASX (a US share, an index), add `yahoo = "..."` with its Yahoo Finance symbol,
# e.g. code = "AAPL", yahoo = "AAPL".
#
# name/category/ethical are only a starting point. Your Google Sheet's Watchlist
# tab is where you keep your own notes, status and categories.

history_from = "2000-01-01"

